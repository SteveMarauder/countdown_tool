<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 560" role="img" aria-labelledby="title desc">
  <title id="title">CDTT × AI Hackathon</title>
  <desc id="desc">A fine open circuit C with three nodes beside the CDTT × AI Hackathon wordmark.</desc>

  <g id="symbol" transform="translate(52 0)" fill="none" shape-rendering="geometricPrecision">
    <path d="M410 108C246 72 116 151 96 268M96 292C117 414 248 487 410 452"
          stroke="#55DEF8" stroke-width="18" stroke-linecap="round"/>
    <g fill="#04101A" stroke-width="11">
      <circle cx="410" cy="108" r="22" stroke="#55DEF8"/>
      <circle cx="96" cy="280" r="22" stroke="#7C72FF"/>
      <circle cx="410" cy="452" r="22" stroke="#F3C675"/>
    </g>
  </g>

  <g id="wordmark" shape-rendering="geometricPrecision">
    <text x="545" y="322" fill="#55DEF8"
          font-family="Bahnschrift, 'Aptos Display', 'Segoe UI', sans-serif"
          font-size="188" font-weight="600" letter-spacing="8">CDTT</text>
    <text x="1095" y="312" fill="#F3C675"
          font-family="Bahnschrift, 'Aptos Display', 'Segoe UI', sans-serif"
          font-size="124" font-weight="400">×</text>
    <text x="1235" y="322" fill="#7C72FF"
          font-family="Bahnschrift, 'Aptos Display', 'Segoe UI', sans-serif"
          font-size="188" font-weight="600" letter-spacing="8">AI</text>
    <text x="1020" y="420" fill="#8F86FF" text-anchor="middle"
          font-family="Bahnschrift, 'Aptos', 'Segoe UI', sans-serif"
          font-size="48" font-weight="400" letter-spacing="20">HACKATHON</text>
  </g>
</svg>
